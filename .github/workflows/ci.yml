name: Api-Connect CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-connect-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-api:
    name: Validate Node.js / Express API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Node.js tests
        run: npm test

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          find src -type f -name "*.js" -print0 | xargs -0 -n1 node --check

  dotnet:
    name: Build .NET Aspire solution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore solution
        run: dotnet restore "Api-Connect.slnx"

      - name: Build solution
        run: dotnet build "Api-Connect.slnx" --configuration Release --no-restore
